name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  host:
    name: Host build + tests (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build libbz2-dev zlib1g-dev libosmesa6-dev
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build -j$(nproc)
      - name: Test
        run: ctest --test-dir build --output-on-failure

  arm:
    name: ARM Linux build + tests under qemu (AArch32 JIT)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install cross toolchain and armhf libraries
        run: |
          sudo sed -i 's/^Types: deb$/Types: deb\nArchitectures: amd64/' /etc/apt/sources.list.d/ubuntu.sources
          printf 'Types: deb\nURIs: http://ports.ubuntu.com/ubuntu-ports/\nSuites: noble noble-updates noble-security\nComponents: main universe\nArchitectures: armhf\nSigned-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg\n' | sudo tee /etc/apt/sources.list.d/ports.sources
          sudo dpkg --add-architecture armhf
          sudo apt-get update
          sudo apt-get install -y ninja-build qemu-user g++-arm-linux-gnueabihf zlib1g-dev:armhf libbz2-dev:armhf libssl-dev:armhf
      - name: Configure
        run: cmake -S . -B build-arm -G Ninja -DCMAKE_TOOLCHAIN_FILE=cmake/toolchains/armhf-linux.cmake -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build-arm -j$(nproc)
      - name: Test
        run: ctest --test-dir build-arm --output-on-failure

  vita:
    name: PS Vita build (VitaSDK)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build name
        id: build_name
        run: |
          version=$(sed -n 's/^set(VITA_VERSION *"\(.*\)")/\1/p' cmake/VitaApp.cmake)
          commit=$(git rev-parse --short HEAD)
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "name=VitaPS2-$version-$commit" >> "$GITHUB_OUTPUT"
      - name: Build VPK
        run: |
          docker run --rm -e VITAPS2_COMMIT=${{ steps.build_name.outputs.commit }} -e VITAPS2_NAME=${{ steps.build_name.outputs.name }} -v "$PWD:/src" -w /src vitasdk/vitasdk:latest /bin/sh -c '
            set -e
            echo "vitaGL and dependencies in the SDK image:"
            ls -l $VITASDK/arm-vita-eabi/lib/ | grep -i -E "vitagl|vitashark|shacccg|mathneon|taihen" || true
            cmake -S . -B build-vita \
              -DCMAKE_TOOLCHAIN_FILE=$VITASDK/share/vita.toolchain.cmake \
              -DCMAKE_BUILD_TYPE=Release \
              -DVITAPS2_COMMIT=$VITAPS2_COMMIT
            cmake --build build-vita -j$(nproc) -- -k || {
              echo "Segment layout:"
              $VITASDK/bin/arm-vita-eabi-readelf -lW build-vita/vitaps2 || true
              exit 1
            }
            $VITASDK/bin/arm-vita-eabi-readelf -lW build-vita/vitaps2 | grep -E "LOAD|Type"
            cp build-vita/VitaPS2.vpk "build-vita/$VITAPS2_NAME.vpk"
          '
      - name: Upload VPK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.build_name.outputs.name }}
          path: build-vita/${{ steps.build_name.outputs.name }}.vpk
          if-no-files-found: error
