<text class="m" x="48" y="364.0" font-size="11" text-anchor="end">0</text>
<line class="grid" x1="56" x2="590" y1="325.1" y2="325.1"/>
<text class="m" x="48" y="329.1" font-size="11" text-anchor="end">5</text>
<line class="grid" x1="56" x2="590" y1="290.3" y2="290.3"/>
<text class="m" x="48" y="294.3" font-size="11" text-anchor="end">10</text>
<line class="grid" x1="56" x2="590" y1="255.4" y2="255.4"/>
<text class="m" x="48" y="259.4" font-size="11" text-anchor="end">15</text>
<line class="grid" x1="56" x2="590" y1="220.6" y2="220.6"/>
<text class="m" x="48" y="224.6" font-size="11" text-anchor="end">20</text>
<line class="grid" x1="56" x2="590" y1="185.7" y2="185.7"/>
<text class="m" x="48" y="189.7" font-size="11" text-anchor="end">25</text>
<line class="grid" x1="56" x2="590" y1="150.9" y2="150.9"/>
<text class="m" x="48" y="154.9" font-size="11" text-anchor="end">30</text>
<line class="grid" x1="56" x2="590" y1="116.0" y2="116.0"/>
<text class="m" x="48" y="120.0" font-size="11" text-anchor="end">35</text>
<line class="ref" x1="56" x2="590" y1="150.9" y2="150.9"/>
<text class="t2" x="598" y="154.9" font-size="11">full speed</text>
<text class="m" x="56" y="380" font-size="11">2026-11-02</text>
<text class="m" x="590" y="380" font-size="11" text-anchor="end">2026-11-02</text>
<polyline class="line" style="stroke:var(--s1)" points="56.0,291.0 100.5,300.0 145.0,299.3 189.5,298.7 234.0,298.7 278.5,298.0 323.0,299.3 501.0,302.8 590.0,285.4"/>
