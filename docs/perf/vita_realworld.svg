<polyline class="line" style="stroke:var(--s2)" points="56.0,360.0 100.5,305.6 145.0,291.7 189.5,291.0 234.0,347.5 323.0,298.0 367.5,301.4 412.0,304.9 456.5,299.3 501.0,316.1 545.5,281.9 590.0,258.9"/>
