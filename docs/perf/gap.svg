<title id="t">VitaPS2 performance gap</title>
<desc id="d">ARM instructions the emulator needs per PS2 instruction, per workload, over time. Latest: Integer (CRC loop) 5.33, Float (matrix x vector) 7.88, 128-bit MMI (pixel blend) 6.24, Loads/stores (all sizes) 7.76. Lower is better; 1.0 is one-to-one.</desc>
