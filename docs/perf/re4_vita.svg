<title id="t">VitaPS2 on PS Vita hardware: Resident Evil 4 frame rates</title>
<desc id="d">Frame rates measured on a PS Vita for each build. Latest (Tier 2 round 2: fast RAM path, likely branch exits, memory exceptions in the quota): Title screen - fps, Opening movie 38.2 fps. Full speed shows 30 fps.</desc>
