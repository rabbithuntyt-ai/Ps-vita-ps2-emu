# VitaPS2 per-game defaults, keyed by disc serial (see the overlay / log.txt
# for a game's serial). Settings chosen in the pause menu override these.
#
# Keys:
#   name             informational
#   ee_cycle_rate    0 = auto, or a percentage (50, 60, 75, 90, 100, 130)
#   frame_skip       0..3
#   threaded_vu1     1 = VU1 on its own core, 0 = off (for games that glitch)
#   software_renderer 1 = software GS (accuracy), 0 = GPU
#   interlaced       1 = half the lines per frame (software renderer)
#
# Entries are added from hardware test reports.

[SLUS-20228]
name=Silent Hill 2
threaded_vu1=1
