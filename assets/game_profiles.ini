# VitaPS2 per-game defaults, keyed by disc serial (see the overlay / log.txt
# for a game's serial). Settings chosen in the pause menu override these.
#
# Keys:
#   name             informational
#   ee_cycle_rate    0 = auto, or a percentage (50, 60, 75, 90, 100, 130)
#   frame_skip       0..3
#   threaded_vu1     1 = VU1 on its own core, 0 = off (for games that glitch)
#   software_renderer 1 = software GS (accuracy), 0 = GPU
#   interlaced       1 = half the lines per frame (software renderer)
#   mpeg_hle         1 = movies decoded natively (libmpeg 2.2 and 3.0 games; checked per game)
#   ee_slice         EE cycles per time slice (default 4800): longer is much faster, too long breaks games
#   iop_rate         IOP clock, percent of real speed (default 100)
#   thread_lock_hle  1 = Resident Evil 4 USA: critical sections without kernel calls (with mpeg_hle)
#   vu_no_clamp      1 = VU float operands not clamped (faster VU code; games that need clamping break)
#   vu1_async        1 = VIF1 work on the VU1 thread, the EE does not wait for it (needs threaded_vu1)
#   re4_skip_dof     Resident Evil 4: draws left out after the depth blur starts (176; 0 = off)
#   re4_vu1_hle      1 = Resident Evil 4: world vertex program run natively instead of on VU1
#   gpu_world        1 = with re4_vu1_hle: the world's vertices transformed by the GPU
#   gpu_world_retained 1 = with gpu_world: world batches kept in GPU buffers, drawn by matrix
#   re4_skin         1 = Resident Evil 4: skinning programs run as native code (VU1, bit-exact; needs vu_no_clamp)
#   gpu_skin         1 = Resident Evil 4: skinning batches drawn by the GPU world path (needs re4_skin, re4_vu1_hle, gpu_world)
#   gs_frames_ahead  vblanks the emulation thread may run ahead of the GS thread (2 default, up to 4)
#
# Entries are added from hardware test reports.

[SLUS-20228]
name=Silent Hill 2
threaded_vu1=1
mpeg_hle=1

[SLUS-21134]
name=Resident Evil 4
# Tested 2026-11-16 on the Vita: New Game through the movies into the first real-time scene
# (the old threaded VU1 hang there is gone), gameplay 1.6-2.0 game fps (was 0.6-0.8)
threaded_vu1=1
vu1_async=1
re4_skip_dof=176
re4_vu1_hle=1
gpu_world=1
gpu_world_retained=1
mpeg_hle=1
ee_slice=19200
thread_lock_hle=1
vu_no_clamp=1
# 2026-11-23: native skinning and 4 vblanks of lead: 230/234 game frames in 120 s (213 without the lead)
re4_skin=1
gpu_skin=1
gs_frames_ahead=4
