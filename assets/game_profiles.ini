# VitaPS2 per-game defaults, keyed by disc serial (see the overlay / log.txt
# for a game's serial). Settings chosen in the pause menu override these.
#
# Keys:
#   name             informational
#   ee_cycle_rate    0 = auto, or a percentage (50, 60, 75, 90, 100, 130)
#   frame_skip       0..3
#   threaded_vu1     1 = VU1 on its own core, 0 = off (for games that glitch)
#   software_renderer 1 = software GS (accuracy), 0 = GPU
#   interlaced       1 = half the lines per frame (software renderer)
#   mpeg_hle         1 = movies decoded natively (libmpeg 2.2 and 3.0 games; checked per game)
#   ee_slice         EE cycles per time slice (default 4800): longer is much faster, too long breaks games
#   iop_rate         IOP clock, percent of real speed (default 100)
#   thread_lock_hle  1 = Resident Evil 4 USA: critical sections without kernel calls (with mpeg_hle)
#
# Entries are added from hardware test reports.

[SLUS-20228]
name=Silent Hill 2
threaded_vu1=1
mpeg_hle=1

[SLUS-21134]
name=Resident Evil 4
threaded_vu1=1
mpeg_hle=1
ee_slice=19200
thread_lock_hle=1
